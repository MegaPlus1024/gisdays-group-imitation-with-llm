[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-agent-lab"
version = "0.1.0"
description = "Local LLM agent simulation research prototype."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "browser: optional tests that may use browser automation",
  "playwright: optional tests for Playwright integration",
  "optional_browser: optional browser backend tests",
]
